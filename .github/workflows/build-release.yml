name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore IMPAKT_Security_Scanner.sln

      - name: Build
        run: dotnet build IMPAKT_Security_Scanner.sln --configuration Release --no-restore --warnaserror

      - name: Test
        run: dotnet test IMPAKT_Security_Scanner.sln --configuration Release --no-build --no-restore

      - name: Publish self-contained applications
        run: bash build.sh "${{ matrix.runtime }}"

      - name: Collect application binaries
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p artifacts/release
          for project in src/*/*.csproj; do
            application="$(basename "$project" .csproj)"
            publish_dir="artifacts/publish/$application/$RUNTIME"
            if [[ -f "$publish_dir/$application.exe" ]]; then
              cp "$publish_dir/$application.exe" "artifacts/release/$application-$RUNTIME.exe"
            else
              cp "$publish_dir/$application" "artifacts/release/$application-$RUNTIME"
            fi
          done

      - name: Store release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all release binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binaries-*
          path: artifacts/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts/release
        run: sha256sum -b * > SHA256SUMS.txt

      - name: Create release for this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == "false" ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            cat > release-notes.md <<EOF
          Automatische build van main, commit $GITHUB_SHA.

          Eén self-contained binary per applicatie per platform, met de naam Applicatie-runtime
          (met .exe op Windows). Er zijn geen archieven en geen losse runtime-bestanden nodig.

          Op Linux en macOS eerst uitvoerbaar maken: chmod +x <bestand>.
          Policies worden niet meegeleverd; de officiële Wazuh-bron staat in
          src/Compliance_Scanner/Policies/CIS/README.md in de repository.
          SHA256SUMS.txt bevat de SHA-256-controlesommen van alle bestanden.

          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" \
              --notes-file release-notes.md
          fi
          gh release upload "$tag" artifacts/release/* --clobber
          gh release edit "$tag" --draft=false
